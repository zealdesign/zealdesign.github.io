<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>找不到頁面 | Zeal Design 知益設計家</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
      :root {
        --ink: #181818;
        --soft-ink: #44423f;
        --paper: #fbfbf8;
        --white: #ffffff;
        --line: #d9ddd8;
        --brand: #c92525;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: "Noto Sans TC", Arial, sans-serif;
        text-align: center;
        padding: 32px 20px;
      }
      .wrap { max-width: 480px; }
      .num {
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(5rem, 22vw, 9rem);
        line-height: 1;
        color: var(--brand);
        margin: 0;
      }
      h1 {
        margin: 16px 0 0;
        font-size: clamp(1.3rem, 4vw, 1.8rem);
        font-weight: 700;
        line-height: 1.3;
      }
      p {
        margin: 14px 0 0;
        color: var(--soft-ink);
        line-height: 1.7;
      }
      .logo {
        display: block;
        width: 110px;
        margin: 0 auto 36px;
      }
      .back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 30px;
        min-height: 46px;
        padding: 10px 22px;
        background: var(--brand);
        border-radius: 4px;
        color: var(--white);
        font-weight: 900;
        text-decoration: none;
      }
      .back:hover { opacity: 0.88; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a href="/"><img class="logo" src="assets/logo.png" alt="Zeal Design"></a>
      <p class="num">404</p>
      <h1>找不到這個頁面</h1>
      <p>您要找的內容可能已移除或網址輸入有誤。<br>回到首頁繼續瀏覽吧。</p>
      <a class="back" href="/">回到首頁</a>
    </div>
  </body>
</html>
